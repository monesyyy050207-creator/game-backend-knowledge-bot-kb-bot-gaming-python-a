[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "game-backend-knowledge-bot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openai"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*"]
